# aixed/WeChat-Hook DLL 连接
hook:
  api_base: http://127.0.0.1:30001          # DLL 注入 WeChat 后起的 HTTP 服务
  callback_host: 127.0.0.1                  # 我们启的回调 server 监听地址
  callback_port: 8888                       # 回调端口
  api_timeout_s: 5.0
  self_wxid: ""                             # 你的微信 wxid（防止 DLL 不小心推自发消息过来；不填 = 不过滤）
                                            # 例如: "wxid_abc123def456"

# 过滤规则
filter:
  # 白名单群（用 roomid，不是群显示名——DLL 只返回 roomid）
  # 例如: "195940014@chatroom" / "50463089950@chatroom"
  # 空数组 = 全部群都监听
  groups:
    - "195940014@chatroom"
  # 白名单发送人（用 wxid）
  # 空数组 = 群里所有发送人
  senders: []
  # 关键词命中（任一命中就入库），子串匹配
  keywords:
    - "报价"
    - "合同"
    - "付款"
    - "deadline"
    - "@你"
  # 大小写敏感开关，默认 true（不敏感），符合实际聊天场景
  case_insensitive: true

# LLM 评分
llm:
  base_url: https://api.deepseek.com/v1
  api_key: REPLACE_ME
  model: deepseek-chat
  # 逐条消息让 LLM 打分（1~5，写进数据库的 score 列）。
  # ⚠️ 默认关闭：它唯一的实际用途是给 Bark 推送做阈值判断；
  #    自动回复走模板匹配、当日归档走 priority（标定/监控名单/重点人），都不看这个分。
  #    打开 = 每条别人发来的文本消息一次 LLM 调用（花额度）。
  score_enabled: false
  # 评分阈值，>= threshold 的会推送通知（仅在 score_enabled 打开时生效）
  push_threshold: 4

# 推送通道
bark:
  enabled: true
  server: https://api.day.app
  key: REPLACE_ME

# 存储
storage:
  sqlite_path: data/messages.db
  # 入库类型闸门：列在这里的 msg_type 不入库（编辑入口：Web「消息分类」页）。
  # ⚠️ 表情 47 恒排除，写不写在这里都一样。
  ingest_exclude_types: [47]
  # ---- 消息库按期自动清理（编辑入口：Web「🧩 消息分类」页的「数据清理」区块）----
  # 保留最近 N 个自然日（含今天）；更早的消息会被**真正删除**（不可恢复）。
  # 0 = 不自动清理（默认；建议先观察一段时间再打开）。1~6 视为非法 → 不会执行。
  retention_days: 0
  # 是否每天自动清理一次（需 retention_days >= 7 才生效）
  auto_cleanup: true
  # 每天这个点之后清理一次（一天最多一次；与归档时间 23:30 错开）
  cleanup_time: "00:00"
  # 删完是否顺带 VACUUM 回收磁盘（会持锁较久，默认关；也可在页面上手动勾）
  cleanup_vacuum: false

# 每日重点发言归档 → Markdown（+ 可选的 LLM 当日总结）
digest:
  enabled: true
  time: "23:30"
  dir: reports
  # 归档后顺带让 LLM 写一份当日总结（没配置 LLM 时自动跳过）
  summarize: true
  # 归档排除的消息类型（噪音闸门）；改完可直接重跑当天归档，不必重新入库。
  # ⚠️ 归档范围 = 监控名单里的群的全部对话（重点人只用 ★ 标记、不再过滤）。
  #    默认排除图片(3)：**无法把图片内容交给模型**（本地是加密 .dat、微信只在内存解密），
  #    只留一行 `[图片 214×480]` 占位没意义；表情/系统同理。
  #    注意还有**入库闸门** storage.ingest_exclude_types —— 被它挡掉的类型这里也不会出现。
  exclude_types: [3, 47, 51, 10000]
